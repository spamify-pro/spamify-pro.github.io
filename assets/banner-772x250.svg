<svg width="772" height="250" viewBox="0 0 772 250" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#0a0e1c"/>
    <stop offset="100%" stop-color="#141a30"/>
  </linearGradient>
  <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#6366f1"/>
    <stop offset="100%" stop-color="#8b5cf6"/>
  </linearGradient>
  <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#a5b4fc"/>
    <stop offset="100%" stop-color="#c4b5fd"/>
  </linearGradient>
  <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#f59e0b"/>
    <stop offset="100%" stop-color="#ef4444"/>
  </linearGradient>
  <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#6366f1" stop-opacity="0.22"/>
    <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.16"/>
    <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
  </radialGradient>
</defs>

<rect width="772" height="250" fill="url(#bgGrad)"/>
<ellipse cx="600" cy="115" rx="260" ry="190" fill="url(#glowA)"/>
<ellipse cx="110" cy="230" rx="200" ry="140" fill="url(#glowB)"/>

<!-- Logo -->
<rect x="40" y="26" width="30" height="30" rx="9" fill="url(#brandGrad)"/>
<g transform="translate(46,32) scale(0.75)" fill="#ffffff">
  <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-1 14l-3-3 1.41-1.41L11 12.17l4.59-4.58L17 9l-6 6z"/>
</g>
<text x="80" y="47" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Spamify</text>

<!-- Headline -->
<text x="40" y="120" font-family="Segoe UI, sans-serif" font-size="32" font-weight="800" letter-spacing="-0.5" fill="#f8fafc">Stop spam.</text>
<text x="40" y="160" font-family="Segoe UI, sans-serif" font-size="32" font-weight="800" letter-spacing="-0.5" fill="url(#textGrad)">Not customers.</text>

<!-- Tagline -->
<text x="41" y="187" font-family="Segoe UI, sans-serif" font-size="13.5" fill="#94a3b8">Self-contained anti-spam engine for WordPress forms</text>

<!-- Bottom pill -->
<rect x="40" y="203" width="248" height="30" rx="15" fill="rgba(99,102,241,0.16)" stroke="rgba(129,140,248,0.35)" stroke-width="1"/>
<text x="164" y="222" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#c7d2fe">Free forever · WordPress.org</text>

<!-- Corner plus marks -->
<g stroke="rgba(255,255,255,0.30)" stroke-width="1.4" stroke-linecap="round">
  <line x1="438" y1="34" x2="450" y2="34"/>
  <line x1="444" y1="28" x2="444" y2="40"/>
  <line x1="734" y1="228" x2="746" y2="228"/>
  <line x1="740" y1="222" x2="740" y2="234"/>
</g>

<!-- Verdict-card mockup -->
<rect x="452" y="42" width="280" height="178" rx="18" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

<circle cx="472" cy="64" r="3.5" fill="#ff5f57"/>
<circle cx="484" cy="64" r="3.5" fill="#febc2e"/>
<circle cx="496" cy="64" r="3.5" fill="#28c840"/>
<text x="508" y="68" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" letter-spacing="0.4" fill="#94a3b8">LIVE CHECK</text>

<rect x="468" y="80" width="248" height="34" rx="9" fill="rgba(255,255,255,0.045)"/>
<text x="478" y="101" font-family="Consolas, Segoe UI, sans-serif" font-size="11.5" fill="#cbd5e1">john.doe@gmail.com</text>
<rect x="652" y="87" width="64" height="20" rx="10" fill="#064e3b"/>
<text x="684" y="101" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" font-weight="800" fill="#6ee7b7">Passed</text>

<rect x="468" y="120" width="248" height="34" rx="9" fill="rgba(255,255,255,0.045)"/>
<text x="478" y="141" font-family="Consolas, Segoe UI, sans-serif" font-size="11.5" fill="#cbd5e1">win$$@mailinator.com</text>
<rect x="652" y="127" width="64" height="20" rx="10" fill="#450a0a"/>
<text x="684" y="141" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" font-weight="800" fill="#fca5a5">Blocked</text>

<text x="468" y="176" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="600" fill="#94a3b8">Spam score</text>
<rect x="468" y="182" width="150" height="7" rx="3.5" fill="rgba(255,255,255,0.08)"/>
<rect x="468" y="182" width="138" height="7" rx="3.5" fill="url(#barGrad)"/>
<text x="628" y="188" font-family="Segoe UI, sans-serif" font-size="13" font-weight="800" fill="#f87171">92</text>

<!-- Floating chips -->
<rect x="560" y="18" width="168" height="30" rx="15" fill="url(#brandGrad)"/>
<text x="644" y="37" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="800" fill="#ffffff">7 Detection Layers</text>

<rect x="400" y="206" width="152" height="30" rx="15" fill="#10b981"/>
<text x="476" y="225" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="800" fill="#052e21">100% Self-Hosted</text>
</svg>
