<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="100%" stop-color="#f5f3ff"/>
  </linearGradient>
  <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#6366f1"/>
    <stop offset="100%" stop-color="#8b5cf6"/>
  </linearGradient>
  <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#6366f1" stop-opacity="0.16"/>
    <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.13"/>
    <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
  </radialGradient>
</defs>

<rect width="1200" height="630" fill="url(#bgGrad)"/>
<ellipse cx="990" cy="230" rx="340" ry="280" fill="url(#glowA)"/>
<ellipse cx="140" cy="520" rx="300" ry="220" fill="url(#glowB)"/>

<!-- Eyebrow pill -->
<g>
  <rect x="90" y="138" width="230" height="34" rx="17" fill="#eef0ff"/>
  <text x="205" y="160" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" letter-spacing="1.8" fill="#4f46e5">WORDPRESS PLUGIN</text>
</g>

<!-- Wordmark -->
<text x="88" y="315" font-family="Segoe UI, sans-serif" font-size="72" font-weight="800" letter-spacing="-1.5" fill="#0e1526">Spamify</text>

<!-- Tagline -->
<text x="90" y="359" font-family="Segoe UI, sans-serif" font-size="21" fill="#5b6478">Self-contained anti-spam engine for WordPress forms</text>

<!-- Pills -->
<g font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">
  <rect x="90" y="397" width="200" height="36" rx="18" fill="#eef0ff"/>
  <text x="190" y="420" text-anchor="middle" fill="#4f46e5">7 Detection Layers</text>

  <rect x="306" y="397" width="200" height="36" rx="18" fill="#dcfce7"/>
  <text x="406" y="420" text-anchor="middle" fill="#047857">No Cloud Required</text>

  <rect x="522" y="397" width="200" height="36" rx="18" fill="#f5edff"/>
  <text x="622" y="420" text-anchor="middle" fill="#7c3aed">100+ Integrations</text>
</g>

<!-- Divider + fine print -->
<line x1="90" y1="475" x2="722" y2="475" stroke="#e7eaf3" stroke-width="1.5"/>
<text x="90" y="499" font-family="Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#334155">spamify-pro.github.io</text>
<text x="270" y="499" font-family="Segoe UI, sans-serif" font-size="15" fill="#8b93a7">Free forever · GPL-2.0 · WordPress plugin</text>

<!-- Brand badge -->
<rect x="860" y="150" width="280" height="280" rx="64" fill="url(#brandGrad)"/>
<g transform="translate(920,210) scale(6.667)" fill="#ffffff">
  <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-1 14l-3-3 1.41-1.41L11 12.17l4.59-4.58L17 9l-6 6z"/>
